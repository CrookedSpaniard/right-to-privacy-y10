<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Right to privacy · Year 10 Online Safety</title>
  <meta name="description" content="A 30-minute games-based lesson on the right to privacy for Year 10 Online Safety: a data trail, privacy circles, the four UK privacy laws, the Privacy Court, a data inspector game, an app sign-up with terms and conditions, a privacy spectrum and a debate builder. Class mode for the projector and solo mode for students. Every answer is saved and can be copied for the teacher.">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="lesson.css">
  <link rel="stylesheet" href="scenes.css">
</head>
<body class="solo-mode">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="logo" role="img" aria-label="British School Alzira · Xàtiva · Gandia"></span>
        <div class="titles">
          <p class="kicker">Year 10 · Online Safety</p>
          <h1>Right to privacy</h1>
        </div>
      </div>
      <div class="top-actions">
        <button class="chip-btn mode-btn" id="btnMode" aria-pressed="false" title="Class mode: the teacher leads on the projector. Solo mode: you work on your own.">👤 Solo mode</button>
        <button class="chip-btn clock-btn" id="btnClock" aria-pressed="false" title="Lesson clock: click to start or pause, double-click to reset" hidden>⏱ <b>00:00</b> / 30</button>
        <button class="chip-btn prog-btn" id="btnProgress" title="See, copy and move your progress">📊 My progress <b id="progPct">0%</b></button>
        <button class="chip-btn" id="btnHelp" title="How to use this website" aria-label="How to use this website">? Help</button>
        <button class="chip-btn" id="btnProjector" aria-pressed="false" title="Bigger text for the classroom projector (P)">Projector mode</button>
        <button class="chip-btn" id="btnFull" title="Full screen (F)">Full screen</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Games"></nav>
  </header>

  <main>
    <section class="lab" id="lab">
      <div class="card stage-card">
        <div class="stage-head">
          <span class="scene-ic" id="sceneIc"></span>
          <h2 id="sceneTitle"></h2>
          <span class="mins" id="minBadge" hidden></span>
          <span class="try" id="tryBadge" hidden></span>
        </div>
        <div class="stage" id="stage"></div>
      </div>

      <aside class="side">
        <div class="card narration" id="narration" aria-live="polite">
          <p class="step-count" id="stepCount"></p>
          <h3 id="stepTitle"></h3>
          <div class="step-text" id="stepText"></div>
          <p class="tip" id="stepTip" hidden></p>
        </div>
        <div class="card vocab" id="vocab" hidden>
          <h4>Key words</h4>
          <dl id="vocabList"></dl>
        </div>
      </aside>
    </section>

    <section class="page" id="page" hidden></section>
  </main>

  <footer class="controls" id="controls">
    <button class="btn ghost" id="btnReset" title="Restart this game (R)">↺ <span>Restart</span></button>
    <button class="btn ghost" id="btnBack" title="Back (←)">◀ <span>Back</span></button>
    <button class="btn primary" id="btnPlay" title="Play / pause (Space)">▶ Play</button>
    <button class="btn ghost" id="btnNext" title="Next (→)"><span>Next</span> ▶</button>
    <label class="speed">Speed
      <select id="speed">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
    </label>
    <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>
  </footer>

  <script src="js/core.js"></script>
  <script src="js/test.js"></script>
  <script src="js/scenes/start.js"></script>
  <script src="js/scenes/recap.js"></script>
  <script src="js/scenes/trail.js"></script>
  <script src="js/scenes/circles.js"></script>
  <script src="js/scenes/laws.js"></script>
  <script src="js/scenes/court.js"></script>
  <script src="js/scenes/inspector.js"></script>
  <script src="js/scenes/snapvibe.js"></script>
  <script src="js/scenes/society.js"></script>
  <script src="js/scenes/debate.js"></script>
  <script src="js/scenes/rights.js"></script>
  <script src="js/scenes/quiz.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
